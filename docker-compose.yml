# Dev-only credentials; override via environment variables or a local .env (git-ignored).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crawler}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawler_dev}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crawler}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-crawler_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      args:
        PROJECT: Crawler.Api
    environment:
      ConnectionStrings__Crawler: Host=db;Port=5432;Database=${POSTGRES_DB:-crawler};Username=${POSTGRES_USER:-crawler};Password=${POSTGRES_PASSWORD:-crawler_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-crawler}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-crawler_dev}
    ports:
      - "5129:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # The API applies migrations (D-16). The worker only touches tables when a message arrives,
  # and messages are only published once the API has migrated and is serving requests.
  worker:
    build:
      context: .
      args:
        PROJECT: Crawler.Worker
    environment:
      ConnectionStrings__Crawler: Host=db;Port=5432;Database=${POSTGRES_DB:-crawler};Username=${POSTGRES_USER:-crawler};Password=${POSTGRES_PASSWORD:-crawler_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-crawler}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-crawler_dev}
    ports:
      - "5250:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  db-data:
